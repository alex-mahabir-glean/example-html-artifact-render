<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sample_volume.html</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #1c1915;
        --muted: #5e584f;
        --line: #e4ddd2;
        --paper: #f6f1e8;
        --panel: #fffdf9;
        --accent: #0f6e6b;
        font-family: "IBM Plex Sans", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(15, 110, 107, 0.08), transparent 32rem),
          var(--paper);
      }
      a { color: var(--accent); }
      .stage-page { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
      .stage-bar {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        padding: 16px 20px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .stage-title {
        margin: 0;
        font-family: "IBM Plex Serif", serif;
        font-size: 22px;
      }
      .muted { color: var(--muted); font-size: 13px; margin: 0 0 4px; }
      .stage-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      a.secondary {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
        text-decoration: none;
        border-radius: 999px;
        padding: 10px 14px;
      }
      .frame-wrap { min-height: 0; padding: 16px; }
      iframe {
        width: 100%;
        height: 100%;
        min-height: 70vh;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: white;
      }
      @media (max-width: 800px) {
        .stage-bar { display: block; }
        .stage-actions { margin-top: 12px; }
      }
    </style>
  </head>
  <body>
    <main class="stage-page">
      <header class="stage-bar">
        <div>
          <p class="muted">Artifact 87a062089f174ba5975224739e42b458</p>
          <h1 class="stage-title">sample_volume.html</h1>
        </div>
        <div class="stage-actions">
          <a class="secondary" href="https://github.com/alex-mahabir-glean/example-html-artifact-render">Source</a>
          <a class="secondary" href="https://app.glean.com/library/87a062089f174ba5975224739e42b458">Open in Glean</a>
        </div>
      </header>
      <div class="frame-wrap">
        <iframe src="sample_volume.html" sandbox="allow-scripts" title="Glean HTML graph"></iframe>
      </div>
    </main>
  </body>
</html>
